<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3 Notch Cabinet Co — Production Board</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --brand:#b8ae97; --dark:#191917; --dark2:#232320; --dark3:#2c2c28; --light:#e5e3df; --muted:#7a756d; --border:#3a3935; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Oswald',Arial,sans-serif; background:var(--dark); color:var(--light); overflow:hidden; height:100vh; }

  .kiosk-header {
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid var(--brand);
  }
  .kiosk-header .logo { display:flex; align-items:center; gap:12px; }
  .kiosk-header .logo img { height:50px; }
  .kiosk-header .logo h1 { font-size:24px; color:var(--brand); text-transform:uppercase; letter-spacing:2px; }
  .kiosk-header .clock { font-size:20px; color:var(--brand); font-weight:700; }

  .kiosk-board {
    display:flex;
    gap:10px;
    padding:16px;
    height:calc(100vh - 82px);
    overflow:hidden;
  }
  .kiosk-column {
    flex:1;
    background:var(--dark2);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .kiosk-col-header {
    padding:12px 14px;
    font-size:14px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--brand);
    border-bottom:2px solid var(--brand);
    display:flex;
    justify-content:space-between;
    flex-shrink:0;
  }
  .kiosk-col-header .count { background:var(--dark3); padding:2px 10px; border-radius:10px; color:var(--muted); font-size:13px; }
  .kiosk-cards { flex:1; overflow-y:auto; padding:8px; }
  .kiosk-card {
    padding:12px 14px;
    background:var(--dark3);
    border-radius:6px;
    margin-bottom:6px;
    border-left:3px solid var(--brand);
  }
  .kiosk-card .name { font-size:15px; font-weight:600; }
  .kiosk-card .customer { font-size:12px; color:var(--muted); margin-top:2px; }
  .kiosk-card .address { font-size:11px; color:var(--muted); }
  .kiosk-card .progress { height:3px; background:var(--border); border-radius:2px; margin-top:6px; }
  .kiosk-card .progress-fill { height:100%; background:var(--brand); border-radius:2px; }
</style>
</head>
<body>
<div class="kiosk-header">
  <div class="logo">
    <img src="../../public/logo-transparent.png" alt="3 Notch">
    <h1>Production Board</h1>
  </div>
  <div class="clock" id="clock"></div>
</div>
<div class="kiosk-board" id="kioskBoard"></div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
const SERVER = localStorage.getItem('serverUrl') || 'https://jobtracker.3notchcabinets.com';
const STAGES = ['Ready to Cut','Cutting','Edge Banding','Assembly','Finishing','Ready for Install','Installed - Finish Work'];
const COMPLETION = {'Ready to Cut':10,'Cutting':25,'Edge Banding':40,'Assembly':55,'Finishing':70,'Ready for Install':85,'Installed - Finish Work':95};

let jobs = [];
const socket = io(SERVER);

async function loadJobs() {
  try {
    const r = await fetch(SERVER + '/api/kiosk/jobs');
    jobs = await r.json();
    render();
  } catch {}
}

function render() {
  const board = document.getElementById('kioskBoard');
  board.innerHTML = STAGES.map(stage => {
    const stageJobs = jobs.filter(j => j.stage === stage);
    return '<div class="kiosk-column"><div class="kiosk-col-header"><span>' + stage + '</span><span class="count">' + stageJobs.length + '</span></div><div class="kiosk-cards">' +
      stageJobs.map(j => {
        const pct = COMPLETION[stage] || 0;
        return '<div class="kiosk-card"><div class="name">' + j.job_name + '</div>' +
          (j.job_address ? '<div class="address">' + j.job_address + '</div>' : '') +
          '<div class="progress"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>';
      }).join('') + '</div></div>';
  }).join('');
}

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true });
}

socket.on('job-created', () => loadJobs());
socket.on('job-updated', () => loadJobs());
socket.on('job-deleted', () => loadJobs());

updateClock();
setInterval(updateClock, 1000);
loadJobs();
</script>
</body>
</html>
